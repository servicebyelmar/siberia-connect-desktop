name: Build Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          "APP_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build app
        run: dotnet publish src/SiberiaConnect.csproj -c Release -o publish -p:Version=${{ env.APP_VERSION }}

      - name: VPN core (Xray) and geo files
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force publish/core, deps | Out-Null
          gh release download -R XTLS/Xray-core -p "Xray-windows-64.zip" -D deps
          Expand-Archive deps/Xray-windows-64.zip -DestinationPath deps/xray -Force
          Copy-Item deps/xray/xray.exe publish/core/
          Copy-Item deps/xray/LICENSE publish/core/LICENSE-xray.txt -ErrorAction SilentlyContinue
          Invoke-WebRequest https://github.com/v2fly/domain-list-community/releases/latest/download/dlc.dat -OutFile publish/core/geosite.dat
          Invoke-WebRequest https://github.com/v2fly/geoip/releases/latest/download/geoip.dat -OutFile publish/core/geoip.dat
          Invoke-WebRequest "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile deps/MicrosoftEdgeWebview2Setup.exe
          # sing-box (ветка 1.11) — режим «Весь компьютер» (TUN, wintun встроен)
          $sb = gh release list -R SagerNet/sing-box --limit 1000 --json tagName --jq '.[].tagName' | Where-Object { $_ -match '^v1\.11\.\d+$' } | Select-Object -First 1
          if (-not $sb) { throw "sing-box 1.11 не найден" }
          gh release download $sb -R SagerNet/sing-box -p "sing-box-*-windows-amd64.zip" -D deps/sb
          Get-ChildItem deps/sb/*.zip | ForEach-Object { Expand-Archive $_.FullName -DestinationPath deps/sb/x -Force }
          Get-ChildItem deps/sb/x -Recurse -Filter sing-box.exe | Select-Object -First 1 | Copy-Item -Destination publish/core/sing-box.exe
          Get-ChildItem deps/sb/x -Recurse -Filter LICENSE | Select-Object -First 1 | Copy-Item -Destination publish/core/LICENSE-sing-box.txt -ErrorAction SilentlyContinue
          & publish/core/xray.exe version
          & publish/core/sing-box.exe version
          Get-ChildItem publish -Recurse | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Self-test (configs checked by the real engines)
        shell: pwsh
        run: |
          Start-Process -FilePath publish/SiberiaConnect.exe -ArgumentList '--selftest', "$PWD/selftest" -Wait
          Get-ChildItem selftest
          if (Test-Path selftest/error.txt) { Get-Content selftest/error.txt; throw "самопроверка упала — текст ошибки выше" }
          $env:XRAY_LOCATION_ASSET = "$PWD/publish/core"
          foreach ($f in 'xray-reality.json', 'xray-xhttp.json', 'xray-tun.json') {
            & publish/core/xray.exe run -test -c "selftest/$f"
            if ($LASTEXITCODE -ne 0) { throw "xray отверг $f" }
          }
          & publish/core/sing-box.exe check -c selftest/tun.json
          if ($LASTEXITCODE -ne 0) { throw "sing-box отверг tun.json" }

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc installer/setup.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Sign update (ключ только в секретах GitHub)
        shell: pwsh
        env:
          UPDATE_KEY: ${{ secrets.UPDATE_KEY }}
        run: |
          if (-not $env:UPDATE_KEY) { throw "Нет секрета UPDATE_KEY: GitHub → Settings → Secrets and variables → Actions → New repository secret" }
          $exe = Get-ChildItem out/SiberiaConnect-Setup-*.exe | Select-Object -First 1
          $sha = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $ec = [System.Security.Cryptography.ECDsa]::Create()
          $ec.ImportFromPem($env:UPDATE_KEY)
          $msg = [System.Text.Encoding]::ASCII.GetBytes("SiberiaConnect-Windows|$env:APP_VERSION|$sha")
          $fmt = [System.Security.Cryptography.DSASignatureFormat]::Rfc3279DerSequence
          $sha256 = [System.Security.Cryptography.HashAlgorithmName]::SHA256
          $sigBytes = $ec.SignData($msg, $sha256, $fmt)
          # проверяем подпись тем открытым ключом, который зашит в приложение — ровно как это сделает приложение
          $src = Get-Content src/Updater.cs -Raw
          if (-not ($src -match '(-----BEGIN PUBLIC KEY-----[\s\S]*?-----END PUBLIC KEY-----)')) { throw "В Updater.cs нет открытого ключа" }
          $pub = [System.Security.Cryptography.ECDsa]::Create()
          $pub.ImportFromPem($Matches[1])
          if (-not $pub.VerifyData($msg, $sigBytes, $sha256, $fmt)) { throw "Секрет UPDATE_KEY не подходит к открытому ключу в Updater.cs" }
          $sig = [Convert]::ToBase64String($sigBytes)
          [ordered]@{ version = $env:APP_VERSION; sha256 = $sha; sig = $sig } | ConvertTo-Json | Set-Content out/update.json -Encoding utf8NoBOM
          Get-Content out/update.json

      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath "out/SiberiaConnect-Portable-$env:APP_VERSION.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: SiberiaConnect-Windows-${{ env.APP_VERSION }}
          path: out/*
          retention-days: 30
